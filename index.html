<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova LiveStream</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
    }

    header {
      padding: 15px 18px;
      background: #15151d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    .red {
      color: #ff304f;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 15px;
    }

    .video-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #181820;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
      background: #000;
    }

    .offline {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex-direction: column;
    }

    .live-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: #ff304f;
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: bold;
      display: none;
      z-index: 5;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }

    #cameraBtn {
      background: #292934;
      color: white;
    }

    #screenBtn {
      background: #1877f2;
      color: white;
    }

    #goLiveBtn {
      background: #ff304f;
      color: white;
    }

    #endLiveBtn {
      background: #292934;
      color: white;
      display: none;
    }

    .info {
      margin-top: 18px;
      padding: 18px;
      background: #15151d;
      border-radius: 12px;
    }

    .status {
      margin-top: 8px;
      color: #aaa;
    }

    .viewer {
      margin-top: 10px;
      color: #aaa;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    🔴 Nova <span class="red">LiveStream</span>
  </div>

  <div>👤 User</div>
</header>

<div class="container">

  <div class="video-box">

    <video id="camera" autoplay muted playsinline></video>

    <video id="screenPreview" autoplay muted playsinline></video>

    <div class="live-badge" id="liveBadge">
      🔴 LIVE
    </div>

    <div class="offline" id="offline">
      <h2>📺 Nova LiveStream</h2>
      <p>Select Camera or Screen Share</p>
    </div>

  </div>

  <div class="buttons">

    <button id="cameraBtn" onclick="startCamera()">
      📷 Camera
    </button>

    <button id="screenBtn" onclick="startScreenShare()">
      📱 Screen Share
    </button>

    <button id="goLiveBtn" onclick="goLive()">
      🔴 Go Live
    </button>

    <button id="endLiveBtn" onclick="endLive()">
      🛑 End Live
    </button>

  </div>

  <div class="info">

    <h2>Nova LiveStream</h2>

    <p>Camera, microphone and Android screen sharing</p>

    <div class="status">
      Status:
      <span id="status">Offline</span>
    </div>

    <div class="viewer">
      👀 Viewers:
      <span id="viewerCount">0</span>
    </div>

  </div>

</div>

<script>

let cameraStream = null;
let screenStream = null;
let activeStream = null;
let isLive = false;


/* CAMERA */

async function startCamera() {

  try {

    stopAllStreams();

    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: true
    });

    activeStream = cameraStream;

    const video = document.getElementById("camera");

    video.srcObject = cameraStream;
    video.style.display = "block";

    document.getElementById("screenPreview").style.display = "none";
    document.getElementById("offline").style.display = "none";

    document.getElementById("status").innerText =
      "Camera & Microphone ON";

  } catch (error) {

    alert(
      "Camera/Microphone permission is required."
    );

    console.log(error);
  }
}


/* SCREEN SHARE */

async function startScreenShare() {

  try {

    stopAllStreams();

    screenStream = await navigator.mediaDevices.getDisplayMedia({

      video: {
        width: { ideal: 1280 },
        height: { ideal: 720 },
        frameRate: { ideal: 30 }
      },

      audio: true
    });

    activeStream = screenStream;

    const video = document.getElementById("screenPreview");

    video.srcObject = screenStream;
    video.style.display = "block";

    document.getElementById("camera").style.display = "none";
    document.getElementById("offline").style.display = "none";

    document.getElementById("status").innerText =
      "Screen Share Ready";

    const track = screenStream.getVideoTracks()[0];

    if (track) {

      track.addEventListener("ended", () => {

        if (!isLive) {
          stopScreenShare();
        }

      });

    }

  } catch (error) {

    console.log(error);

    alert(
      "Screen sharing cancelled or not supported."
    );

  }
}


/* GO LIVE */

function goLive() {

  if (!activeStream) {

    alert(
      "First select Camera or Screen Share."
    );

    return;
  }

  isLive = true;

  document.getElementById("liveBadge").style.display =
    "block";

  document.getElementById("goLiveBtn").style.display =
    "none";

  document.getElementById("endLiveBtn").style.display =
    "inline-block";

  document.getElementById("status").innerText =
    "LIVE";

  document.getElementById("viewerCount").innerText =
    "1";

}


/* END LIVE */

function endLive() {

  isLive = false;

  document.getElementById("liveBadge").style.display =
    "none";

  document.getElementById("goLiveBtn").style.display =
    "inline-block";

  document.getElementById("endLiveBtn").style.display =
    "none";

  document.getElementById("status").innerText =
    "Offline";

  document.getElementById("viewerCount").innerText =
    "0";

  stopAllStreams();

  document.getElementById("offline").style.display =
    "flex";

}


/* STOP SCREEN */

function stopScreenShare() {

  if (screenStream) {

    screenStream.getTracks().forEach(track => {
      track.stop();
    });

    screenStream = null;
  }

  activeStream = null;

  document.getElementById("screenPreview").srcObject =
    null;

  document.getElementById("screenPreview").style.display =
    "none";

  document.getElementById("offline").style.display =
    "flex";

  document.getElementById("status").innerText =
    "Offline";
}


/* STOP ALL */

function stopAllStreams() {

  if (cameraStream) {

    cameraStream.getTracks().forEach(track => {
      track.stop();
    });

    cameraStream = null;
  }

  if (screenStream) {

    screenStream.getTracks().forEach(track => {
      track.stop();
    });

    screenStream = null;
  }

  activeStream = null;

  document.getElementById("camera").srcObject = null;
  document.getElementById("screenPreview").srcObject = null;

  document.getElementById("camera").style.display =
    "none";

  document.getElementById("screenPreview").style.display =
    "none";
}

</script>

</body>
  </html>
