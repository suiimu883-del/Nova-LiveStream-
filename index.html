<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova LiveStream</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
    }

    header {
      padding: 15px 18px;
      background: #15151d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    .red {
      color: #ff304f;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 15px;
    }

    .video-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #181820;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .offline {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex-direction: column;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }

    #startBtn {
      background: #ff304f;
      color: white;
    }

    #stopBtn {
      background: #292934;
      color: white;
      display: none;
    }

    .info {
      margin-top: 18px;
      padding: 18px;
      background: #15151d;
      border-radius: 12px;
    }

    .status {
      margin-top: 8px;
      color: #aaa;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">🔴 Nova <span class="red">LiveStream</span></div>
  <div>👤 User</div>
</header>

<div class="container">

  <div class="video-box">

    <video id="camera" autoplay muted playsinline></video>

    <div class="offline" id="offline">
      <h2>📺 Live Stream</h2>
      <p>Camera is currently off</p>
    </div>

  </div>

  <div class="buttons">

    <button id="startBtn" onclick="startCamera()">
      🔴 Start Camera
    </button>

    <button id="stopBtn" onclick="stopCamera()">
      ⏹ Stop Camera
    </button>

  </div>

  <div class="info">
    <h2>Nova LiveStream</h2>
    <p>Camera & microphone test</p>

    <div class="status">
      Status: <span id="status">Offline</span>
    </div>
  </div>

</div>

<script>

let stream = null;

async function startCamera() {

  try {

    stream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: true
    });

    const video = document.getElementById("camera");

    video.srcObject = stream;
    video.style.display = "block";

    document.getElementById("offline").style.display = "none";

    document.getElementById("startBtn").style.display = "none";
    document.getElementById("stopBtn").style.display = "inline-block";

    document.getElementById("status").innerText = "Camera & Microphone ON";

  } catch (error) {

    alert(
      "Camera/Microphone permission is required.\n\n" +
      "Please allow Camera and Microphone access."
    );

    console.log(error);

  }

}

function stopCamera() {

  if (stream) {

    stream.getTracks().forEach(track => track.stop());

    stream = null;

  }

  const video = document.getElementById("camera");

  video.srcObject = null;
  video.style.display = "none";

  document.getElementById("offline").style.display = "flex";

  document.getElementById("startBtn").style.display = "inline-block";
  document.getElementById("stopBtn").style.display = "none";

  document.getElementById("status").innerText = "Offline";

}

</script>

</body>
</html>
